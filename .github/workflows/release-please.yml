name: Release Please

# On every push to main: open/update the "chore: release vX.Y.Z" PR
# (bumps package.json, updates CHANGELOG.md). Merging that PR creates the tag + GitHub Release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
